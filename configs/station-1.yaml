# ===========================================================================
#  Simulator host: training station 1
# ===========================================================================
#  One host = one IP address.  The host is a BACnet router; every instance
#  below is its own BACnet device on the host's virtual network:
#
#    192.168.0.79:47808  router, device 4010000   (IP network = ip_network)
#      └── virtual network 5001
#            ├── UH-1-SIM  device 4010001  MAC 1   -> 5001:1
#            └── UH-2-SIM  device 4010002  MAC 2   -> 5001:2
# ===========================================================================

host:
  name: SIM-HOST-1
  device_instance: 4010000            # the router's own device instance
  address: 192.168.0.79/24            # this machine's IP on the lab network
  ip_network: 2400                    # BACnet network number of the lab IP network:
                                      #   MUST match the number the ALC system uses
  virtual_network: 5001               # MUST be unique in the whole BACnet internetwork
  location: Training Lab
  weather: WX-1                       # weather station shared by every instance on this host
  speed: 1.0                          # 1.0 = real time
  step: 0.1                           # s between simulation updates

web:
  port: 8080                          # http://<host>:8080  (all instances on one page)

instances:
  - name: WX-1                        # weather station: OA temp / RH for the ALC system and all simulators
    template: templates/weather_station.yaml
    device_instance: 4010090
    mac: 90

  - name: UH-1-SIM
    template: templates/hw_unit_heater.yaml
    device_instance: 4010001
    mac: 1                            # address on the virtual network (1-254)
    vars: { n: 1 }                    # fan_amps_1, zone_temp_1
    controller:
      device_instance: 240104         # <-- ALC controller device ID (trainee design)
      # address: 192.168.1.20         # optional: skip Who-Is

  - name: UH-2-SIM
    template: templates/hw_unit_heater.yaml
    device_instance: 4010002
    mac: 2
    vars: { n: 2 }                    # fan_amps_2, zone_temp_2
    controller:
      device_instance: 240105         # same controller as UH-1, or a different one
    equipment:
      params:
        hw_supply_temp: 140.0         # per-instance overrides merge into the template

  # --- VFDs (ACH580-style) --------------------------------------------------
  - name: SF-1-VFD                    # fieldbus: ALC reads/writes the drive's objects
    template: templates/vfd_ach580_bacnet.yaml
    device_instance: 4010011
    mac: 11

  - name: SF-2-VFD                    # hardwired: DI1 / AI1 terminals, RO2 / RO3 / AO1 to ALC
    template: templates/vfd_ach580_hardwired.yaml
    device_instance: 4010012
    mac: 12
    vars: { n: 2 }                    # sf2_status, sf2_fault, sf2_speed_fb
    controller:
      device_instance: 240110

  # --- Air handler ------------------------------------------------------------
  - name: AHU-1
    template: templates/ahu_vav_econ.yaml
    device_instance: 4010020
    mac: 20
    controller:
      device_instance: 240106         # <-- ALC AHU controller device ID (trainee design)
